name: T3 release

# Builds the C API libraries T3 Code downloads for local speech synthesis, then publishes them as
# a GitHub release. Linux builds in manylinux_2_28 so they load on glibc 2.28 and newer. Linux and
# Windows load Vulkan and the per-CPU-generation kernels as ggml plugins, so hosts without a GPU
# or Vulkan loader fall back to the CPU. OpenMP is off, so nothing depends on libgomp or vcomp.
# eSpeak-ng is linked in for Kokoro; its data package and source archive are published once.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as t3-2026.11.15
        required: true
      publish:
        description: Publish the release; leave off to only build and check the libraries.
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} \
            bash ci/t3/build-linux-lib.sh "${{ inputs.tag }}" \
            "audio-${{ inputs.tag }}-lib-linux-${{ matrix.arch }}-vulkan.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: audio-${{ inputs.tag }}-lib-linux-${{ matrix.arch }}-vulkan.tar.gz

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            sdk: windows
            # MSVC builds one CPU backend per x86 CPU generation.
            defines: -DENGINE_ENABLE_CPU_ALL_VARIANTS=ON
          # ggml needs clang for ARM CPU kernels and has no Windows ARM variant list, so this
          # targets the oldest Windows 11 ARM CPUs (Snapdragon 7c, 8cx) with one CPU backend.
          - arch: arm64
            runner: windows-11-arm
            sdk: warm
            # Quoted: PowerShell splits an unquoted -argument at its first period.
            defines: >-
              -DENGINE_ENABLE_BACKEND_PLUGINS=ON
              "-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16"
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DAUDIOCPP_ESPEAK_C_COMPILER=cl -DAUDIOCPP_ESPEAK_CXX_COMPILER=cl
    env:
      VULKAN_VERSION: "1.4.357.0"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\vulkan_sdk.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/${{ matrix.sdk }}/vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\vulkan_sdk.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"
      - name: Find clang
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvm = @("C:\Program Files\LLVM\bin", "$env:VCINSTALLDIR\Tools\Llvm\ARM64\bin", "$env:VCINSTALLDIR\Tools\Llvm\bin") |
            Where-Object { Test-Path "$_\clang.exe" } | Select-Object -First 1
          if (-not $llvm) { throw "clang is not installed on this runner" }
          Add-Content $env:GITHUB_PATH $llvm
          & "$llvm\clang.exe" --version
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build-t3 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DAUDIOCPP_BUILD_C_API=ON `
            "-DAUDIOCPP_VERSION=${{ inputs.tag }}" `
            -DENGINE_ENABLE_CUDA=OFF `
            -DENGINE_ENABLE_VULKAN=ON `
            -DENGINE_ENABLE_NATIVE_CPU=OFF `
            -DENGINE_ENABLE_LLAMAFILE=ON `
            -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF `
            -DAUDIOCPP_STATIC_ESPEAK=ON `
            ${{ matrix.defines }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-t3 --target audiocpp --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show the eSpeak build log
        if: failure()
        shell: pwsh
        run: Get-Content build-t3/audiocpp_espeak_source-prefix/src/audiocpp_espeak_source-stamp/*-build-*.log -Tail 80
      - name: Stage and check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-lib/libs, dist-lib/include | Out-Null
          Copy-Item include/audiocpp.h dist-lib/include/
          Copy-Item LICENSE dist-lib/
          New-Item -ItemType Directory -Force -Path dist-lib/licenses/espeak-ng | Out-Null
          Copy-Item build-t3/bin/licenses/espeak-ng/* dist-lib/licenses/espeak-ng/ -Exclude *.tar.gz
          Copy-Item build-t3/bin/*.dll dist-lib/libs/
          # Hosts without the Visual C++ runtime installed still load the library.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\${{ matrix.arch }}" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" dist-lib/libs/
          # Only the Vulkan plugin may import the loader, or GPU-less hosts could not load the library.
          $imports = dumpbin /dependents dist-lib/libs/audiocpp.dll | Out-String
          if ($imports -match "vulkan-1.dll") { throw "audiocpp.dll imports vulkan-1.dll" }
          if (-not (Test-Path dist-lib/libs/ggml-vulkan.dll)) { throw "the Vulkan plugin is missing" }
          if (-not (Get-ChildItem dist-lib/libs -Filter "ggml-cpu*.dll")) { throw "the CPU backend is missing" }
          Compress-Archive -Path dist-lib/* -DestinationPath "audio-${{ inputs.tag }}-lib-windows-${{ matrix.arch }}-vulkan.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: audio-${{ inputs.tag }}-lib-windows-${{ matrix.arch }}-vulkan.zip

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            backend: metal
            metal: "ON"
          # Upstream builds Intel Macs without Metal too.
          - arch: x64
            runner: macos-26-intel
            backend: cpu
            metal: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build-t3 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='@loader_path' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DAUDIOCPP_BUILD_C_API=ON \
            -DAUDIOCPP_VERSION="${{ inputs.tag }}" \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF \
            -DGGML_METAL=${{ matrix.metal }} \
            -DENGINE_ENABLE_LLAMAFILE=ON \
            -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF \
            -DAUDIOCPP_STATIC_ESPEAK=ON
          cmake --build build-t3 --target audiocpp --parallel "$(sysctl -n hw.logicalcpu)"
          mkdir -p dist-lib/libs dist-lib/include dist-lib/licenses/espeak-ng
          cp include/audiocpp.h dist-lib/include/
          cp LICENSE dist-lib/
          find build-t3/bin/licenses/espeak-ng -maxdepth 1 -type f ! -name '*.tar.gz' -exec cp {} dist-lib/licenses/espeak-ng/ \;
          find build-t3/bin -maxdepth 1 -name '*.dylib' -exec cp -P {} dist-lib/libs/ \;
          tar -czf "audio-${{ inputs.tag }}-lib-macos-${{ matrix.arch }}-${{ matrix.backend }}.tar.gz" -C dist-lib .
      - name: Stage eSpeak data and source
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p espeak
          cp build-t3/bin/espeak-ng-data.bin "espeak/audio-${{ inputs.tag }}-espeak-ng-data.bin"
          cp build-t3/bin/licenses/espeak-ng/*.tar.gz espeak/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: audio-${{ inputs.tag }}-lib-macos-${{ matrix.arch }}-${{ matrix.backend }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: espeak
          path: espeak/*

  release:
    if: inputs.publish
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "${{ inputs.tag }}" \
            --notes "C API libraries for T3 Code, built from ${{ github.sha }}." *
